name: benchmark-pooling

# Runs the pooling latency benchmark on a Linux runner with native Docker.
# The figure quoted in paper/paper.md was measured on macOS under Docker
# Desktop, whose virtual machine inflates container creation; this provides a
# native-Linux comparison that anyone can re-run and inspect from the public
# logs. Manual dispatch only -- it creates and destroys containers serially and
# takes minutes, so it has no place on every push.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Timed executions per arm"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Record environment
        run: |
          echo "docker: $(docker version --format '{{.Server.Version}}')"
          echo "kernel: $(uname -sr)"
          echo "cpus: $(nproc)"
          echo "mem: $(free -g | awk '/^Mem:/{print $2}')GB"

      # ITERATIONS is passed through the environment rather than interpolated
      # into the script body: `${{ inputs.* }}` is attacker-controlled text and
      # expanding it inline would allow shell injection.
      - name: Run pooling benchmark
        env:
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          uv run --extra docker python benchmarks/pooling_latency.py \
            --iterations "$ITERATIONS" \
            --backend docker \
            --json pooling-latency.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pooling-latency
          path: pooling-latency.json
          if-no-files-found: error
