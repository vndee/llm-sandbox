# SonarQube Cloud - Automatic Analysis configuration.
#
# This is the file Automatic Analysis reads (Administration > Analysis method).
# sonar-project.properties in this repo is NOT read: that filename is for the
# CLI scanner, and no workflow here runs one.

# Copy-paste detection.
#
# examples/agent_sdks/ deliberately repeats the same ~30-line sandbox setup in
# every file. Those examples are meant to be copied out whole, so factoring the
# block into a shared import would leave a copy-paster with an ImportError and
# no idea which container hardening they had just dropped. See
# examples/agent_sdks/README.md.
#
# Note the double asterisk: `examples/*` does not cross a directory separator,
# so it would miss everything under examples/agent_sdks/.
sonar.cpd.exclusions=examples/**,tests/**

# Deliberately NOT setting sonar.exclusions for examples/ here.
#
# Excluding them outright also turns off the security rules, and the examples
# are the code people copy. That exclusion is why an unsafe smolagents pattern
# (CodeAgent defaults to executing on the host) reached review unflagged --
# SonarCloud only caught it because a new subdirectory happened to fall outside
# the existing `examples/*` glob. Keep the rules on; silence duplication only.
