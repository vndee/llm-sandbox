# SonarQube Cloud project configuration for the CLI scanner (sonar-scanner).
#
# NOTE: this file is NOT read by Automatic Analysis, which is what currently
# analyses this project -- no workflow here runs a scanner. Automatic Analysis
# reads .sonarcloud.properties instead. Keep this file in sync if you ever
# switch to CI-based analysis; until then .sonarcloud.properties is the one
# that takes effect.
sonar.projectKey=vndee_llm-sandbox
sonar.organization=vndee

# Project information
sonar.projectName=llm-sandbox
sonar.projectVersion=0.3.2

# Source directories - only include the main package
sonar.sources=llm_sandbox

# Exclusions - exclude everything except the main package
sonar.exclusions=\
  tests/**,\
  tests/**/*,\
  examples/**,\
  docs/**,\
  site/**,\
  htmlcov/**,\
  plots/**,\
  dockers/**,\
  .venv/**,\
  .mypy_cache/**,\
  .ruff_cache/**,\
  .pytest_cache/**,\
  __pycache__/**,\
  *.pyc,\
  *.pyo,\
  *.pyd,\
  pyproject.toml,\
  uv.lock,\
  tox.ini,\
  mkdocs.yml,\
  codecov.yaml,\
  LICENSE,\
  Makefile,\
  .gitignore,\
  .pre-commit-config.yaml,\
  README.md,\
  CHANGELOG.md,\
  CODE_OF_CONDUCT.md,\
  CONTRIBUTING.md,\
  coverage.xml,\
  .coverage

# Language settings
sonar.python.version=3.10,3.11,3.12,3.13

# Coverage settings - point to the coverage report
sonar.python.coverage.reportPaths=coverage.xml

# Code duplication threshold - allow slightly higher duplication for code generation patterns
sonar.cpd.exclusions=\
  tests/**,\
  examples/**

# Security hotspots - exclude test files from security analysis
sonar.security.hotspots.file.exclusions=\
  tests/**,\
  examples/**
